name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      # Secret sync runs BEFORE deploy so new code starts with current values. 1Password is
      # the source of truth; Cloudflare is a push-only mirror — same reasoning and same
      # pattern as elc-web/.github/workflows/deploy.yml. Guarded on .op-secrets existing:
      # this repo has one, most MCP repos don't yet.
      - name: Install 1Password CLI
        if: hashFiles('.op-secrets') != ''
        uses: 1password/install-cli-action@v1

      - name: Sync secrets from 1Password
        if: hashFiles('.op-secrets') != ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OP_VAULT: "ELC Automation"
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            item="$(echo "$line" | awk '{print $1}')"
            cf="$(echo "$line" | awk '{print $2}')"
            [ -z "$cf" ] && cf="$item"
            if ! op read "op://${OP_VAULT}/${item}/credential" >/dev/null 2>&1; then
              echo "::error::${item} not readable in vault '${OP_VAULT}'"
              exit 1
            fi
            op read "op://${OP_VAULT}/${item}/credential" | npx wrangler secret put "$cf"
            echo "synced: ${item} -> ${cf}"
          done < .op-secrets

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check — tools/list
        run: |
          set -euo pipefail
          sleep 5
          resp=$(curl -sf -X POST "https://www.engineeringleaders.io/mcp/partnership" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "$resp" | grep -q '"get_started"' || { echo "::error::tools/list missing get_started"; exit 1; }
          echo "smoke check passed"
