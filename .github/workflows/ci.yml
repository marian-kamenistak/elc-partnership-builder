name: deploy

# elc-partnership-builder is a PUBLIC repo. src/data/offer-catalog.json (real pricing,
# internal notes, the unpublished vendor tier) is deliberately gitignored and generated
# locally by web/elc-web (a PRIVATE repo) — it can never exist in this repo's CI, and
# must never be bundled by a CI-run `wrangler deploy`, which would ship fake/placeholder
# data straight to production if the fixture were ever in place at deploy time.
#
# So this workflow verifies (test + type-check, against a redacted fixture — see
# src/data/offer-catalog.fixture.json) but does NOT deploy. Deploy stays a manual
# `npm run deploy` from Marian's Mac, exactly as it is today, using the real local file.
# This is the one MCP repo where that split is deliberate — the other four fully
# automate deploy because none of them have this confidentiality constraint.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The real src/data/offer-catalog.json never exists in this checkout (gitignored,
      # generated by a private sibling repo). Stand the redacted fixture in for it so
      # catalog.ts's static import resolves — see the fixture's own generation note in
      # src/data/offer-catalog.fixture.json for what was redacted and why.
      - name: Stand in the redacted fixture for the real (gitignored) catalog
        run: cp src/data/offer-catalog.fixture.json src/data/offer-catalog.json

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check
